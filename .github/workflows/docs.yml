name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Validate first-party Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test Markdown link checker
        run: python -B .github/scripts/test_check_markdown_links.py

      - name: Test complete Markdown audit
        run: python -B .github/scripts/test_audit_markdown.py

      - name: Check first-party Markdown links
        run: python .github/scripts/check_markdown_links.py --tracked-first-party

      - name: Classify changed scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
            head_ref="$PR_HEAD_SHA"
          else
            base_ref="$EVENT_BEFORE"
            head_ref="$CURRENT_SHA"
          fi

          if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python .github/scripts/discover_esp_idf_examples.py \
            --base-ref "$base_ref" \
            --head-ref "$head_ref" >/dev/null
          echo "mode=range" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Audit Markdown policy and diff scope
        shell: bash
        env:
          AUDIT_MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ steps.scope.outputs.base_ref }}
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
        run: |
          set -euo pipefail
          audit=(
            python .github/scripts/audit_markdown.py .
            --config .github/markdown-audit-config.json
          )

          if [[ "$AUDIT_MODE" == "all" ]]; then
            "${audit[@]}" --all --strict
            exit 0
          fi

          "${audit[@]}" --base "$BASE_REF" --strict
          if [[ "$DOCS_ONLY" == "true" ]]; then
            "${audit[@]}" --base "$BASE_REF" --expect-docs-only --strict
          fi
